<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>バーコード読み取り</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
      text-align: center;
      background: #f5f5f5;
    }
    h2 { margin-top: 30px; }
    button {
      padding: 14px 24px;
      font-size: 17px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      margin: 10px;
    }
    #reader {
      width: 100%;
      max-width: 400px;
      margin: 20px auto;
    }
    #message {
      font-size: 16px;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <h2>📷 バーコード読み取り</h2>
  <p>商品バーコードをカメラに映してください。</p>

  <div id="reader"></div>
  <p id="message">「読み取り開始」を押してください。</p>
  <button id="startButton" onclick="startScanner()">読み取り開始</button>
  <button id="stopButton" onclick="stopScanner()">停止</button>

  <script>
    let scanner = null;
    let scanning = false;

    async function startScanner() {
      const message = document.getElementById('message');

      try {
        if (typeof Html5Qrcode === 'undefined') {
          throw new Error('読み取り機能を読み込めませんでした');
        }

        if (!scanner) {
          scanner = new Html5Qrcode('reader');
        }

        await scanner.start(
          { facingMode: 'environment' },
          { fps: 10, qrbox: { width: 250, height: 150 } },
          async function(decodedText) {
            if (!scanning) return;
            scanning = false;

            message.textContent = '読み取り成功！アプリに戻ります…';

            try {
              await scanner.stop();
            } catch (e) {}

            const params = new URLSearchParams(location.search);
            const returnUrl = params.get('return');

            if (returnUrl) {
              const destination = new URL(returnUrl);

              if (
                destination.protocol === 'https:' &&
                destination.hostname === 'script.google.com' &&
                destination.pathname.includes('/macros/s/')
              ) {
                destination.searchParams.set('barcode', decodedText);
                location.href = destination.toString();
                return;
              }
            }

            message.textContent = '読み取ったバーコード：' + decodedText;
          }
        );

        scanning = true;
        message.textContent = 'バーコードをカメラに映してください。';

      } catch (error) {
        scanning = false;
        message.textContent = 'カメラエラー：' + error.message;
      }
    }

    async function stopScanner() {
      scanning = false;

      if (scanner && scanner.isScanning) {
        await scanner.stop();
      }

      document.getElementById('message').textContent = '読み取りを停止しました。';
    }
  </script>
</body>
</html>
